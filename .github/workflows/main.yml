# .github/workflows/convert-to-pdf.yml

name: Docs to PDF
# This workflow is triggered on pushes to the repository.
on:
  push:
    branches:
      - main
    # Paths can be used to only trigger actions when you have edited certain files, such as a file within the /docs directory
    paths:
      - 'attendance_exercises/**.md'
      - 'attendance_solutions/**.md'

jobs:
  converttopdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: attendance_exercises
          output_dir: pdfs
          build_html: false
      - uses: actions/upload-artifact@v3
        with:
          name: attendance_exercises
          path: pdfs
  
  solutionstopdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: attendance_solutions
          output_dir: pdfs
          build_html: false
      - uses: actions/upload-artifact@v3
        with:
          name: attendance_solutions
          path: pdf_solutions
