# .github/workflows/convert-to-pdf.yml

name: Docs to PDF
# This workflow is triggered on pushes to the repository.
on:
  workflow_dispatch:
    branches:
      - main
    # Paths can be used to only trigger actions when you have edited certain files, such as a file within the /docs directory
    paths:
      - 'attendance_exercises/**.md'
      - 'attendance_solutions/**.md'
  push:
    branches:
      - main
    # Paths can be used to only trigger actions when you have edited certain files, such as a file within the /docs directory
    paths:
      - 'attendance_exercises/**.md'
      - 'attendance_solutions/**.md'

jobs:
  build-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Convert Markdown files to PDF
        run: |
          mkdir -p pdf

          find . -type f -name "*.md" \
            -not -path "./.git/*" \
            -not -path "./pdf/*" \
            | while read -r file; do

              output="pdf/$(basename "${file%.md}").pdf"

              pandoc "$file" \
                --pdf-engine=xelatex \
                -V geometry:margin=1in \
                -o "$output"

            done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: pdf/
